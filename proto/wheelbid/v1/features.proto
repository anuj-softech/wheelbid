syntax = "proto3";

package wheelbid.v1;

message Features {
  TransmissionType transmission = 1;
  FuelType fuel_type = 2;
  string exterior_color = 3;
  string interior_color = 4;
  int32 mileage_km = 5;
  int32 manufacture_year = 6;
  int32 owners_count = 7;
  bool has_sunroof = 8;
  bool has_navigation = 9;
  bool is_insured = 10;
}

enum TransmissionType {
  TRANSMISSION_TYPE_UNSPECIFIED = 0;
  TRANSMISSION_TYPE_MANUAL = 1;
  TRANSMISSION_TYPE_AUTOMATIC = 2;
  TRANSMISSION_TYPE_CVT = 3;
  TRANSMISSION_TYPE_DCT = 4;
}

enum FuelType {
  FUEL_TYPE_UNSPECIFIED = 0;
  FUEL_TYPE_PETROL = 1;
  FUEL_TYPE_DIESEL = 2;
  FUEL_TYPE_ELECTRIC = 3;
  FUEL_TYPE_HYBRID = 4;
}